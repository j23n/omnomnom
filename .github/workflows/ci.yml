# The shared Linux and macOS jobs (j23n/apple-ci), which run `make ci-linux` and `make ci-macos`:
# the food database pipeline's tests, then the app built for the iOS Simulator and its tests.
#
# The app is built with Xcode 27 against the iOS 27 SDK, and with Xcode 26 too, which leaves out
# the two iOS 27 calls (Omnomnom/Modules/Estimation/OnDeviceSDK.swift). `macos` builds and tests
# with the runner's Xcode 26; `macos-xcode-27` does the same with Xcode 27 once the repository
# variable HOSTED_XCODE_27 is `true` (Settings › Secrets and variables › Actions › Variables), set
# when apple-ci's Runner inventory lists Xcode 27 on the hosted runners. Until then it's skipped
# and starts no runner.
name: CI

# apple-ci's workflows decide when each job runs (its README's "When CI runs"): Linux on every push;
# macOS on pushes to main, runs by hand (Actions › CI › Run workflow), and a pull request once it's
# labeled ci:mac, which Claude's review adds when the change needs the Mac's build.
on:
  push:
  pull_request:
    # labeled: the ci:mac label runs the Mac's jobs on a pull request (apple-ci's README, "When CI runs").
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  # A label's run has a group of its own, so labeling a pull request for another reason doesn't cancel
  # the Mac's run.
  group: ci-${{ github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  linux:
    uses: j23n/apple-ci/.github/workflows/linux.yml@main
    with:
      name: Linux · food database pipeline
      apt-packages: python3

  macos:
    uses: j23n/apple-ci/.github/workflows/macos.yml@main
    with:
      name: macOS · pipeline, app and tests with Xcode 26 (iOS Simulator)
      xcode: "26"

  macos-xcode-27:
    if: vars.HOSTED_XCODE_27 == 'true'
    uses: j23n/apple-ci/.github/workflows/macos.yml@main
    with:
      name: macOS · app and tests with Xcode 27 (iOS 27 SDK)
      xcode: "27"
      xcode-missing: skip
